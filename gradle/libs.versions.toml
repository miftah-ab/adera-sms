[versions]
# Build tooling
agp             = "8.3.2"
kotlin          = "1.9.23"
# KSP version must match Kotlin version exactly: <kotlin>-<ksp-patch>
ksp             = "1.9.23-1.0.20"

# AndroidX
coreKtx         = "1.13.0"
lifecycleKtx    = "2.7.0"
activityCompose = "1.9.0"

# Jetpack Compose
composeBom      = "2024.04.01"
# Compose compiler extension version must align with Kotlin version.
# Kotlin 1.9.23 → Compose Compiler 1.5.11
composeCompiler = "1.5.11"

# Room (local database, fully offline)
room            = "2.6.1"

# WorkManager (background SMS send + retry)
workmanager     = "2.9.0"

# Navigation (Compose NavHost)
navigation      = "2.7.7"

# ViewModel for Compose
lifecycleVmCompose = "2.7.0"

# Coroutines
coroutines      = "1.8.0"
browser         = "1.8.0"


[libraries]
# Core AndroidX
androidx-core-ktx              = { group = "androidx.core",       name = "core-ktx",              version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx     = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",     version.ref = "lifecycleKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleKtx" }
androidx-activity-compose      = { group = "androidx.activity",   name = "activity-compose",      version.ref = "activityCompose" }

# Jetpack Compose (BOM manages individual Compose library versions)
compose-bom            = { group = "androidx.compose",    name = "compose-bom",       version.ref = "composeBom" }
compose-ui             = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics    = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling     = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3      = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# WorkManager
workmanager-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

# Navigation Compose
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# ViewModel for Compose
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleVmCompose" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Browser (Chrome Custom Tabs)
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }


[plugins]
android-application = { id = "com.android.application",    version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",     version.ref = "ksp" }
