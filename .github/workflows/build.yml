name: Build Adera SMS

on:
  push:
    branches: [ main, develop ]
    tags:     [ 'v*.*.*' ]       # e.g. v1.0.0, v1.1.0
  pull_request:
    branches: [ main ]
  workflow_dispatch:               # Allow manual trigger from GitHub Actions UI

# Only one build per branch at a time — cancel any in-progress run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Source & Java
      # -----------------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # -----------------------------------------------------------------------
      # 2. Gradle setup — gradle-version: wrapper tells the action to read the
      #    version from gradle-wrapper.properties (currently 8.11.1) and also
      #    generate the gradle-wrapper.jar which is not committed to git.
      # -----------------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper   # reads gradle-wrapper.properties + generates the JAR

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # -----------------------------------------------------------------------
      # 3. Release build — runs on every push / PR (unsigned) and on version
      #    tags (signed, using secrets below).
      # -----------------------------------------------------------------------
      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build Release APK
        env:
          SIGNING_KEY_ALIAS:      ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD:   ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AderaSMS-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # -----------------------------------------------------------------------
      # 4. Release build — only on version tags (v1.0.0, v1.1.0, …)
      #
      #    Required GitHub Actions secrets (add under repo Settings → Secrets):
      #      SIGNING_KEY_BASE64   — base64-encoded keystore.jks
      #      SIGNING_KEY_ALIAS    — key alias used when generating the keystore
      #      SIGNING_KEY_PASSWORD — key password
      #      SIGNING_STORE_PASSWORD — keystore password
      #
      #    To generate and encode the keystore:
      #      keytool -genkey -v -keystore keystore.jks -alias adera \
      #              -keyalg RSA -keysize 2048 -validity 10000
      #      base64 keystore.jks          # macOS/Linux
      #      certutil -encode keystore.jks keystore.b64  # Windows (then copy contents)
      # -----------------------------------------------------------------------
      - name: Rename APK for users
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Adera SMS.apk"

      - name: Upload Signed Release APK (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Adera SMS ${{ github.ref_name }}
          path: "app/build/outputs/apk/release/Adera SMS.apk"
          retention-days: 90

      # -----------------------------------------------------------------------
      # 5. GitHub Release with APK attached
      #    After this, update update-endpoint/version.json with the new
      #    versionCode and push to GitHub Pages so the in-app update checker works.
      # -----------------------------------------------------------------------

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "app/build/outputs/apk/release/Adera SMS.apk"
          name: Adera SMS ${{ github.ref_name }}
          body: |
            ## Adera SMS ${{ github.ref_name }}

            **Installation:**
            1. Download `Adera SMS.apk` below
            2. On your Android phone: Settings → Security → Install unknown apps → allow your browser/Files app
            3. Tap the downloaded APK to install

            **Minimum Android:** 8.0 Oreo (API 26)

            ---
            After uploading this release, update `update-endpoint/version.json` with the new
            `versionCode` from `app/build.gradle.kts` and push to GitHub Pages so the
            in-app update checker notifies existing users.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Cleanup — never leave signing material on the runner
      # -----------------------------------------------------------------------
      - name: Remove keystore from runner
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f keystore.jks

      # -----------------------------------------------------------------------
      # 6. Automate version.json + cross-repo APK publish (Item 10)
      #
      #    Required GitHub Actions secret (add under repo Settings → Secrets):
      #      WEBSITE_DEPLOY_PAT
      #        Type   : Fine-grained Personal Access Token
      #        Scope  : miftah-ab/adera-sms-website repository ONLY
      #        Perms  : Contents — Read and Write  (nothing broader)
      #        Purpose: Allows this workflow to push the APK and version.json
      #                 into the website repo's public/downloads folder.
      #
      #    How to create the token:
      #      GitHub → Settings → Developer settings → Personal access tokens
      #      → Fine-grained tokens → Generate new token
      #      Set "Repository access" to: Only select repositories → adera-sms-website
      #      Set "Permissions → Contents" to: Read and write
      #      Copy the token and save it as the WEBSITE_DEPLOY_PAT secret.
      #
      #    minSupportedVersionCode is deliberately NOT auto-bumped here.
      #    It stays at its previous value so existing users are not force-updated
      #    on every release. Only raise it manually when a genuinely breaking
      #    change requires all users to update.
      # -----------------------------------------------------------------------

      - name: Extract version numbers from build.gradle.kts
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: |
          # Read versionCode and versionName from the single source of truth.
          # These are the same values the build itself used — they cannot drift.
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -oP '\d+' | head -1)
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | grep -oP '"[^"]+"' | head -1 | tr -d '"')
          echo "version_code=$VERSION_CODE"  >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME"  >> "$GITHUB_OUTPUT"
          echo "Extracted versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      - name: Generate version.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Build version.json matching the existing structure used by the in-app
          # update checker. minSupportedVersionCode is intentionally fixed at 1 here;
          # bump it manually when a forced update is genuinely required.
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          cat > version.json <<EOF
          {
            "latestVersionCode": $VERSION_CODE,
            "minSupportedVersionCode": 1,
            "downloadUrl": "https://adera-sms.vercel.app/downloads/AderaSMS.apk",
            "releaseNotes": "Version $VERSION_NAME — see GitHub release for details.",
            "disableCoreService": false
          }
          EOF
          echo "Generated version.json:"
          cat version.json

      - name: Push APK and version.json to adera-sms-website
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # WEBSITE_DEPLOY_PAT must be a Fine-grained PAT with Contents read+write
          # scoped only to miftah-ab/adera-sms-website. See comment above.
          WEBSITE_DEPLOY_PAT: ${{ secrets.WEBSITE_DEPLOY_PAT }}
        run: |
          # Configure git identity for the commit
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the website repo using the PAT for authentication
          git clone "https://x-access-token:${WEBSITE_DEPLOY_PAT}@github.com/miftah-ab/adera-sms-website.git" website-repo

          # Copy APK (rename to the canonical filename the download URL points to)
          cp "app/build/outputs/apk/release/Adera SMS.apk" "website-repo/public/downloads/AderaSMS.apk"

          # Copy generated version.json
          cp version.json "website-repo/public/downloads/version.json"

          # Commit and push
          cd website-repo
          git add public/downloads/AderaSMS.apk public/downloads/version.json
          git commit -m "release: Adera SMS ${{ steps.version.outputs.version_name }} (versionCode ${{ steps.version.outputs.version_code }})" \
            --allow-empty
          git push origin main
          echo "Successfully pushed APK and version.json to adera-sms-website"
