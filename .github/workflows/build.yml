name: Build Adera SMS

on:
  push:
    branches: [ main, develop ]
    tags:     [ 'v*.*.*' ]       # e.g. v1.0.0, v1.1.0
  pull_request:
    branches: [ main ]
  workflow_dispatch:               # Allow manual trigger from GitHub Actions UI

# Only one build per branch at a time — cancel any in-progress run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Source & Java
      # -----------------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # -----------------------------------------------------------------------
      # 2. Gradle setup — downloads Gradle 8.6 if wrapper JAR is missing.
      #    The gradle-wrapper.properties pins the version; this action honours it.
      # -----------------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"   # Matches gradle-wrapper.properties — used to bootstrap the JAR

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Bootstrap gradle-wrapper.jar from the pinned version (binary not committed to git)
      - name: Bootstrap Gradle wrapper JAR
        run: gradle wrapper --gradle-version 8.6

      # -----------------------------------------------------------------------
      # 3. Release build — runs on every push / PR (unsigned) and on version
      #    tags (signed, using secrets below).
      # -----------------------------------------------------------------------
      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build Release APK
        env:
          SIGNING_KEY_ALIAS:      ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD:   ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AderaSMS-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # -----------------------------------------------------------------------
      # 4. Release build — only on version tags (v1.0.0, v1.1.0, …)
      #
      #    Required GitHub Actions secrets (add under repo Settings → Secrets):
      #      SIGNING_KEY_BASE64   — base64-encoded keystore.jks
      #      SIGNING_KEY_ALIAS    — key alias used when generating the keystore
      #      SIGNING_KEY_PASSWORD — key password
      #      SIGNING_STORE_PASSWORD — keystore password
      #
      #    To generate and encode the keystore:
      #      keytool -genkey -v -keystore keystore.jks -alias adera \
      #              -keyalg RSA -keysize 2048 -validity 10000
      #      base64 keystore.jks          # macOS/Linux
      #      certutil -encode keystore.jks keystore.b64  # Windows (then copy contents)
      # -----------------------------------------------------------------------
      - name: Rename APK for users
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Adera SMS.apk"

      - name: Upload Signed Release APK (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Adera SMS ${{ github.ref_name }}
          path: "app/build/outputs/apk/release/Adera SMS.apk"
          retention-days: 90

      # -----------------------------------------------------------------------
      # 5. GitHub Release with APK attached
      #    After this, update update-endpoint/version.json with the new
      #    versionCode and push to GitHub Pages so the in-app update checker works.
      # -----------------------------------------------------------------------

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "app/build/outputs/apk/release/Adera SMS.apk"
          name: Adera SMS ${{ github.ref_name }}
          body: |
            ## Adera SMS ${{ github.ref_name }}

            **Installation:**
            1. Download `Adera SMS.apk` below
            2. On your Android phone: Settings → Security → Install unknown apps → allow your browser/Files app
            3. Tap the downloaded APK to install

            **Minimum Android:** 8.0 Oreo (API 26)

            ---
            After uploading this release, update `update-endpoint/version.json` with the new
            `versionCode` from `app/build.gradle.kts` and push to GitHub Pages so the
            in-app update checker notifies existing users.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Cleanup — never leave signing material on the runner
      # -----------------------------------------------------------------------
      - name: Remove keystore from runner
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f keystore.jks
