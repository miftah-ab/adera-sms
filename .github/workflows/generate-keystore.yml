name: 🔑 One-Time Keystore Setup

# Run this ONCE manually to generate your signing keystore.
# After you add the output values as GitHub Secrets, DELETE this workflow file.
on:
  workflow_dispatch:  # Manual trigger only

jobs:
  generate-keystore:
    name: Generate & Export Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -alias adera \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "AderaSMS2026Store" \
            -keypass  "AderaSMS2026Key" \
            -dname "CN=Adera SMS, OU=Mobile, O=Adera, L=Addis Ababa, ST=Addis Ababa, C=ET"

      - name: Print base64 of keystore
        run: |
          echo "=========================================="
          echo "COPY THESE VALUES INTO GITHUB SECRETS"
          echo "=========================================="
          echo ""
          echo "Secret name : SIGNING_KEY_BASE64"
          echo "Secret value:"
          echo "---START---"
          base64 -w 0 keystore.jks
          echo ""
          echo "---END---"
          echo ""
          echo "Secret name : SIGNING_KEY_ALIAS"
          echo "Secret value: adera"
          echo ""
          echo "Secret name : SIGNING_STORE_PASSWORD"
          echo "Secret value: AderaSMS2026Store"
          echo ""
          echo "Secret name : SIGNING_KEY_PASSWORD"
          echo "Secret value: AderaSMS2026Key"
          echo "=========================================="

      - name: Upload keystore as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-KEEP-THIS-SAFE
          path: keystore.jks
          retention-days: 1
