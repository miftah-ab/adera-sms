name: 🔑 One-Time Keystore Setup (v2 - JKS format)

# Run this ONCE manually to regenerate your signing keystore in JKS format.
# After you update the SIGNING_KEY_BASE64 secret, DELETE this workflow file.
on:
  workflow_dispatch:

jobs:
  generate-keystore:
    name: Generate JKS Keystore & Export
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS keystore (Android-compatible format)
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -storetype JKS \
            -alias adera \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "AderaSMS2026Store" \
            -keypass  "AderaSMS2026Key" \
            -dname "CN=Adera SMS, OU=Mobile, O=Adera, L=Addis Ababa, ST=Addis Ababa, C=ET"

      - name: Verify keystore is readable
        run: |
          keytool -list -keystore keystore.jks \
            -storepass "AderaSMS2026Store" \
            -storetype JKS

      - name: Print base64 — UPDATE your GitHub Secret with this value
        run: |
          echo "=========================================="
          echo "UPDATE SIGNING_KEY_BASE64 SECRET WITH THIS"
          echo "=========================================="
          echo ""
          echo "Go to: https://github.com/miftah-ab/adera-sms/settings/secrets/actions"
          echo "Click SIGNING_KEY_BASE64 → Update → paste the value below"
          echo ""
          echo "---START (copy everything between these lines)---"
          base64 -w 0 keystore.jks
          echo ""
          echo "---END---"
          echo ""
          echo "All other secrets remain the same:"
          echo "  SIGNING_KEY_ALIAS     = adera"
          echo "  SIGNING_STORE_PASSWORD = AderaSMS2026Store"
          echo "  SIGNING_KEY_PASSWORD  = AderaSMS2026Key"
          echo "=========================================="

      - name: Upload JKS keystore as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-JKS-backup-KEEP-SAFE
          path: keystore.jks
          retention-days: 1
